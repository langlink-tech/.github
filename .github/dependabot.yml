version: 2
# Weekly, grouped update PRs (dep-audit 2026-10-11).
# cooldown matches the fleet's 10-day minimumReleaseAge / package-age policy;
# security updates are not delayed by cooldown.
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/ci-tree-reuse
      - /.github/actions/setup-node-pnpm
      - /.github/actions/setup-python-tooling
    schedule:
      interval: weekly
    # No auto-rebase; comment `@dependabot rebase` before merging.
    rebase-strategy: disabled
    open-pull-requests-limit: 5
    cooldown:
      default-days: 10
    groups:
      # Every action update, majors included, in one PR.
      github-actions-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
