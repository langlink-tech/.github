name: Reusable Python Quality

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: "."
      python-version:
        required: false
        type: string
        default: "3.11"
      installer:
        required: false
        type: string
        default: "pip"
      uv-version:
        required: false
        type: string
        default: "0.11.6"
      cache-dependency-path:
        required: true
        type: string
      install-command:
        required: true
        type: string
      lint-command:
        required: false
        type: string
        default: ""
      invariant-command:
        required: false
        type: string
        default: ""
      test-command:
        required: false
        type: string
        default: ""
      upload-source-artifact:
        required: false
        type: boolean
        default: false
      source-artifact-name:
        required: false
        type: string
        default: repo-source
      timeout-minutes:
        required: false
        type: number
        default: 20
      actionlint-enabled:
        description: When true, lint .github/workflows with actionlint before other jobs
        required: false
        type: boolean
        default: true
      actionlint-shellcheck:
        description: When true, also run shellcheck through actionlint. Opt in per repo after cleaning existing scripts.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  actionlint:
    if: ${{ inputs.actionlint-enabled }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run actionlint
        env:
          ACTIONLINT_SHELLCHECK: ${{ inputs.actionlint-shellcheck && 'on' || 'off' }}
        run: |
          set -euo pipefail
          if ! compgen -G ".github/workflows/*.yml" > /dev/null && ! compgen -G ".github/workflows/*.yaml" > /dev/null; then
            echo "No workflow files found; skipping actionlint."
            exit 0
          fi
          version="1.7.12"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl -1sSfL "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" -o "${RUNNER_TEMP}/${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          args=(-oneline)
          if [ "${ACTIONLINT_SHELLCHECK}" = "off" ]; then
            args+=(-shellcheck=)
          fi
          "${RUNNER_TEMP}/actionlint" "${args[@]}"
  lint:
    if: inputs.lint-command != ''
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: langlink-tech/.github/.github/actions/setup-python-tooling@be4f67a71a9db35ca52748af9205d57f6684522a # pinned composite dependencies
        with:
          working-directory: ${{ inputs.working-directory }}
          python-version: ${{ inputs.python-version }}
          installer: ${{ inputs.installer }}
          uv-version: ${{ inputs.uv-version }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          install-command: ${{ inputs.install-command }}
          cache-suffix: lint

      - name: Run lint command
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.lint-command }}

  invariants:
    if: inputs.invariant-command != ''
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: langlink-tech/.github/.github/actions/setup-python-tooling@be4f67a71a9db35ca52748af9205d57f6684522a # pinned composite dependencies
        with:
          working-directory: ${{ inputs.working-directory }}
          python-version: ${{ inputs.python-version }}
          installer: ${{ inputs.installer }}
          uv-version: ${{ inputs.uv-version }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          install-command: ${{ inputs.install-command }}
          cache-suffix: invariants

      - name: Run invariant command
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.invariant-command }}

  tests:
    if: inputs.test-command != ''
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: langlink-tech/.github/.github/actions/setup-python-tooling@be4f67a71a9db35ca52748af9205d57f6684522a # pinned composite dependencies
        with:
          working-directory: ${{ inputs.working-directory }}
          python-version: ${{ inputs.python-version }}
          installer: ${{ inputs.installer }}
          uv-version: ${{ inputs.uv-version }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          install-command: ${{ inputs.install-command }}
          cache-suffix: tests

      - name: Run test command
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.test-command }}

      - name: Pack repository source for downstream checks
        if: inputs.upload-source-artifact
        run: git archive --format=tar.gz --output=repo-source.tgz HEAD

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: inputs.upload-source-artifact
        with:
          name: ${{ inputs.source-artifact-name }}
          path: repo-source.tgz
          if-no-files-found: error
          retention-days: 1
