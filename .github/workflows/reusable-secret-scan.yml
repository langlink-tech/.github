name: Reusable Secret Scan

on:
  workflow_call:
    inputs:
      blocking:
        description: "When true, fail the job if secrets are found. Keep false during rollout (report-only)."
        required: false
        type: boolean
        default: false
      upload-sarif:
        description: "Upload SARIF to GitHub code scanning. Caller must grant security-events write permission."
        required: false
        type: boolean
        default: false
      timeout-minutes:
        required: false
        type: number
        default: 10

permissions:
  contents: read
  # Ceiling for the called token: effective permissions are the caller's grant
  # capped by this list. Callers that set upload-sarif: true must also grant
  # security-events: write on the calling job; without this declaration the
  # called token could never receive it and the SARIF upload would always fail.
  security-events: write

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Infisical CLI
        run: |
          set -euo pipefail
          curl -1sLf https://artifacts-cli.infisical.com/setup.deb.sh | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y infisical

      - name: Run redacted secret scan
        env:
          SCAN_EXIT_CODE: ${{ inputs.blocking && 1 || 0 }}
        run: |
          set -euo pipefail
          mkdir -p reports/security
          infisical scan \
            --source . \
            --redact \
            --report-format sarif \
            --report-path reports/security/infisical-secret-scan.sarif \
            --exit-code "${SCAN_EXIT_CODE}"

      - name: Upload secret scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infisical-secret-scan
          path: reports/security/infisical-secret-scan.sarif
          if-no-files-found: ignore

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && inputs.upload-sarif }}
        continue-on-error: true
        with:
          sarif_file: reports/security/infisical-secret-scan.sarif
