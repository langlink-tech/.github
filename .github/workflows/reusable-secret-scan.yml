name: Reusable Secret Scan

on:
  workflow_call:
    inputs:
      blocking:
        description: "When true (default), fail the job if secrets are found. Set false only as a temporary, explicit report-only opt-out while cleaning a baseline."
        required: false
        type: boolean
        default: true
      upload-sarif:
        description: "Upload SARIF to GitHub code scanning. Caller must grant security-events write permission."
        required: false
        type: boolean
        default: false
      timeout-minutes:
        required: false
        type: number
        default: 10

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Infisical CLI (pinned, checksum-verified)
        env:
          INFISICAL_CLI_VERSION: "0.43.138"
          INFISICAL_CLI_SHA256: "45a98380964650e4cc2b57ff5361d174afb55b3daf7c2465640d3a7bb7550f92"
        run: |
          set -euo pipefail
          archive="cli_${INFISICAL_CLI_VERSION}_linux_amd64.tar.gz"
          workdir="${RUNNER_TEMP}/infisical-cli"
          mkdir -p "${workdir}/bin"
          curl -fsSL --max-redirs 5 --retry 3 -o "${workdir}/${archive}" \
            "https://github.com/Infisical/cli/releases/download/v${INFISICAL_CLI_VERSION}/${archive}"
          echo "${INFISICAL_CLI_SHA256}  ${workdir}/${archive}" | sha256sum -c -
          tar -xzf "${workdir}/${archive}" -C "${workdir}/bin" infisical
          echo "${workdir}/bin" >> "${GITHUB_PATH}"
          "${workdir}/bin/infisical" --version

      - name: Run redacted secret scan
        env:
          SCAN_EXIT_CODE: ${{ inputs.blocking && 1 || 0 }}
        run: |
          set -euo pipefail
          mkdir -p reports/security
          infisical scan \
            --source . \
            --redact \
            --report-format sarif \
            --report-path reports/security/infisical-secret-scan.sarif \
            --exit-code "${SCAN_EXIT_CODE}"

      - name: Upload secret scan report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: infisical-secret-scan
          path: reports/security/infisical-secret-scan.sarif
          if-no-files-found: ignore

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        if: ${{ always() && inputs.upload-sarif }}
        continue-on-error: true
        with:
          sarif_file: reports/security/infisical-secret-scan.sarif
