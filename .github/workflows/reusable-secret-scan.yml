name: Reusable Secret Scan

on:
  workflow_call:
    inputs:
      blocking:
        description: "When true, fail the job if secrets are found. Keep false during rollout (report-only)."
        required: false
        type: boolean
        default: false
      upload-sarif:
        description: "Deprecated, no effect: the scan job is limited to contents: read. Upload the infisical-secret-scan artifact from a caller job that grants security-events: write."
        required: false
        type: boolean
        default: false
      timeout-minutes:
        required: false
        type: number
        default: 10

# Explicit least privilege: the scan only reads the repository. Callers must grant
# contents: read; nothing broader is inherited from the calling job.
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install Infisical CLI
        run: |
          set -euo pipefail
          curl -1sLf https://artifacts-cli.infisical.com/setup.deb.sh | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y infisical

      - name: Run redacted secret scan
        env:
          SCAN_EXIT_CODE: ${{ inputs.blocking && 1 || 0 }}
        run: |
          set -euo pipefail
          mkdir -p reports/security
          infisical scan \
            --source . \
            --redact \
            --report-format sarif \
            --report-path reports/security/infisical-secret-scan.sarif \
            --exit-code "${SCAN_EXIT_CODE}"

      - name: Upload secret scan report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: infisical-secret-scan
          path: reports/security/infisical-secret-scan.sarif
          if-no-files-found: ignore

      - name: SARIF upload is not performed here
        if: ${{ always() && inputs.upload-sarif }}
        run: echo "::warning::upload-sarif is ignored; this workflow only has contents:read. Upload the infisical-secret-scan artifact from a caller job with security-events:write."
